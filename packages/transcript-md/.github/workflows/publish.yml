# Trusted publisher identity: @supersuit/transcript-md, SupersuitUp/transcript-md, publish.yml, no environment.
name: Publish transcript-md through OIDC
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.repository == 'SupersuitUp/transcript-md'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.9'
      - name: Preserve candidate Git identity for external synthetic repositories
        run: |
          echo "GIT_AUTHOR_NAME=$(git log -1 --format=%an)" >> "$GITHUB_ENV"
          echo "GIT_AUTHOR_EMAIL=$(git log -1 --format=%ae)" >> "$GITHUB_ENV"
          echo "GIT_COMMITTER_NAME=$(git log -1 --format=%an)" >> "$GITHUB_ENV"
          echo "GIT_COMMITTER_EMAIL=$(git log -1 --format=%ae)" >> "$GITHUB_ENV"
      - name: Locked package configuration
        run: |
          mkdir -p "$RUNNER_TEMP/transcript-md-config"
          touch "$RUNNER_TEMP/transcript-md-config/user.npmrc" "$RUNNER_TEMP/transcript-md-config/global.npmrc"
          npm ci --ignore-scripts --offline --no-audit --no-fund --userconfig "$RUNNER_TEMP/transcript-md-config/user.npmrc" --globalconfig "$RUNNER_TEMP/transcript-md-config/global.npmrc" --cache "$RUNNER_TEMP/transcript-md-config/cache"
      - name: Actual native core regressions
        run: node scripts/run-tests.mjs
        env:
          TRANSCRIPT_MD_LABEL: core
          TRANSCRIPT_MD_OWNED: ${{ runner.temp }}/transcript-md-core
          TRANSCRIPT_MD_EVIDENCE: ${{ runner.temp }}/transcript-md-evidence
      - name: Exact pack audit and clean installed README/API/CLI/Python boundary
        run: node scripts/run-tests.mjs --candidate
        env:
          TRANSCRIPT_MD_LABEL: candidate
          TRANSCRIPT_MD_OWNED: ${{ runner.temp }}/transcript-md-candidate
          TRANSCRIPT_MD_EVIDENCE: ${{ runner.temp }}/transcript-md-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: transcript-md-release-candidate
          path: |
            ${{ runner.temp }}/transcript-md-evidence
            ${{ runner.temp }}/transcript-md-candidate/candidate-*/pack/*.tgz
            ${{ runner.temp }}/transcript-md-candidate/candidate-*/payload-audit.json
      - name: Verify exact tag and upgrade the ephemeral publishing CLI
        run: |
          node --input-type=module -e "import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('package.json'));if(process.env.GITHUB_REF_NAME!=='v'+p.version)throw Error('tag does not match package.json');"
          npm install --global npm@11.6.0 --userconfig "$RUNNER_TEMP/transcript-md-config/user.npmrc" --globalconfig "$RUNNER_TEMP/transcript-md-config/global.npmrc" --cache "$RUNNER_TEMP/transcript-md-config/cache" --ignore-scripts --no-audit --no-fund
      - name: Refuse missing OIDC identity or configured credentials
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -z "${NODE_AUTH_TOKEN:-}" && test -z "${NPM_TOKEN:-}"
      - name: Refuse an already published version and distinguish registry failures
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "@supersuit/transcript-md@$PKG" version --json --userconfig "$RUNNER_TEMP/transcript-md-config/user.npmrc" --globalconfig "$RUNNER_TEMP/transcript-md-config/global.npmrc" > "$RUNNER_TEMP/npm-version.json" 2> "$RUNNER_TEMP/npm-version.stderr"; then
            echo "This version is already published."
            exit 1
          fi
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/npm-version.json'));if(r.error?.code!=='E404')throw Error('registry lookup failed without proving version absence');"
      - name: Publish the same audited and installed tarball through OIDC
        run: |
          TARBALL=$(node --input-type=module -e "import fs from 'node:fs';import crypto from 'node:crypto';const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/transcript-md-evidence/candidate-candidate.json'));if(crypto.createHash('sha256').update(fs.readFileSync(a.tarball)).digest('hex')!==a.sha256)throw Error('audited payload changed');console.log(a.tarball);")
          npm publish "$TARBALL" --access public --userconfig "$RUNNER_TEMP/transcript-md-config/user.npmrc" --globalconfig "$RUNNER_TEMP/transcript-md-config/global.npmrc" --cache "$RUNNER_TEMP/transcript-md-config/cache"
